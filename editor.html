<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Wedding Site Editor V3</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0f0f0f;
        --panel: #181818;
        --border: #2a2a2a;
        --border2: #333;
        --text: #e8e4dc;
        --mid: #888;
        --gold: #b8934a;
        --gold-lt: #d4ae6e;
        --green: #4caf50;
        --red: #e57373;
        --accent: #b8934a;
        --input-bg: #111;
      }

      body {
        font-family: "Tenor Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── TOP BAR ── */
      .topbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0 1.5rem;
        height: 52px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        z-index: 10;
      }

      .topbar-logo {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 1.1rem;
        color: var(--gold);
        margin-right: auto;
      }

      .preview-toggle {
        display: flex;
        background: var(--bg);
        border: 1px solid var(--border2);
      }
      .preview-toggle button {
        padding: 0.4rem 1rem;
        background: transparent;
        border: none;
        color: var(--mid);
        font-family: "Tenor Sans", sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.15s;
      }
      .preview-toggle button.active {
        background: var(--gold);
        color: #fff;
      }

      .btn-export {
        padding: 0.45rem 1.2rem;
        background: var(--gold);
        border: none;
        color: #fff;
        font-family: "Tenor Sans", sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-export:hover {
        background: var(--gold-lt);
      }

      .btn-save {
        padding: 0.45rem 1.2rem;
        background: transparent;
        border: 1px solid var(--border2);
        color: var(--mid);
        font-family: "Tenor Sans", sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn-save:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      /* ── LAYOUT ── */
      .workspace {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── SIDEBAR ── */
      .sidebar {
        width: 380px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: width 0.3s ease;
      }

      .sidebar.collapsed {
        width: 0;
        border: none;
      }

      /* Language Switcher */
      .lang-selector {
        display: flex;
        background: #111;
        border-bottom: 1px solid var(--border);
        padding: 0.5rem;
        gap: 0.5rem;
      }
      .lang-selector button {
        flex: 1;
        padding: 0.5rem;
        background: transparent;
        border: 1px solid var(--border2);
        color: var(--mid);
        font-size: 0.65rem;
        text-transform: uppercase;
        cursor: pointer;
      }
      .lang-selector button.active {
        background: var(--gold);
        color: #fff;
        border-color: var(--gold);
      }

      /* Section tabs */
      .sec-tabs {
        display: flex;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        scrollbar-width: none;
      }
      .sec-tabs::-webkit-scrollbar {
        display: none;
      }

      .sec-tab {
        padding: 0.8rem 1rem;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--mid);
        font-family: "Tenor Sans", sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
      }
      .sec-tab.active {
        color: var(--gold);
        border-bottom-color: var(--gold);
      }

      /* Fields */
      .fields-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
      }

      .field-group {
        margin-bottom: 1.6rem;
      }

      .field-label {
        display: block;
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mid);
        margin-bottom: 0.45rem;
      }

      .field-input {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--border2);
        padding: 0.65rem 0.8rem;
        color: var(--text);
        font-family: "Tenor Sans", sans-serif;
        font-size: 0.85rem;
        outline: none;
        transition: border-color 0.15s;
      }
      .field-input:focus {
        border-color: var(--gold);
      }
      .field-input.textarea {
        resize: vertical;
        min-height: 80px;
        line-height: 1.6;
      }

      /* Color picker row */
      .color-row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .color-swatch {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border2);
        cursor: pointer;
      }
      .color-hex {
        flex: 1;
      }

      /* Repeater */
      .repeater-item {
        background: var(--bg);
        border: 1px solid var(--border2);
        padding: 1rem;
        margin-bottom: 0.8rem;
      }
      .repeater-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.8rem;
      }
      .repeater-item-title {
        font-size: 0.65rem;
        color: var(--gold);
        text-transform: uppercase;
      }
      .btn-del {
        background: none;
        border: none;
        color: var(--red);
        cursor: pointer;
        font-size: 0.7rem;
      }

      .btn-add {
        width: 100%;
        padding: 0.7rem;
        background: transparent;
        border: 1px dashed var(--border2);
        color: var(--mid);
        cursor: pointer;
        font-size: 0.65rem;
        text-transform: uppercase;
        margin-top: 0.5rem;
      }

      /* ── PREVIEW ── */
      .preview-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #000;
      }

      .preview-bar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        background: #111;
        border-bottom: 1px solid var(--border);
      }

      .preview-url {
        flex: 1;
        background: #0a0a0a;
        padding: 0.35rem 0.75rem;
        font-size: 0.75rem;
        color: var(--mid);
        font-family: monospace;
      }

      .preview-frame-wrap {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 1.5rem;
      }

      iframe#preview {
        border: none;
        background: #fff;
        width: 100%;
        height: 100%;
        max-width: 1100px;
      }
      iframe#preview.mobile {
        max-width: 390px;
      }

      .save-toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--green);
        color: #fff;
        padding: 0.7rem 1.4rem;
        font-size: 0.75rem;
        opacity: 0;
        transform: translateY(10px);
        transition: 0.3s;
      }
      .save-toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .panel-section {
        display: none;
      }
      .panel-section.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-logo">Wedding Editor V3</div>
      <div class="preview-toggle">
        <button class="active" onclick="setPanel(true)">✦ Edit</button>
        <button onclick="setPanel(false)">⤢ Preview</button>
      </div>
      <button class="btn-save" onclick="saveLocal()">Save Draft</button>
      <button class="btn-export" onclick="exportSite()">↓ Download Site</button>
    </div>

    <div class="workspace">
      <div class="sidebar" id="sidebar">
        <div class="lang-selector">
          <button
            class="lang-btn active"
            data-lang="en"
            onclick="setLanguage('en')"
          >
            EN
          </button>
          <button class="lang-btn" data-lang="hu" onclick="setLanguage('hu')">
            HU
          </button>
          <button class="lang-btn" data-lang="ru" onclick="setLanguage('ru')">
            RU
          </button>
        </div>

        <div class="sec-tabs">
          <button class="sec-tab active" onclick="showSection('hero')">
            1. Hero
          </button>
          <button class="sec-tab" onclick="showSection('details')">
            2. Venue
          </button>
          <button class="sec-tab" onclick="showSection('schedule')">
            3. Schedule
          </button>
          <button class="sec-tab" onclick="showSection('stay')">4. Stay</button>
          <button class="sec-tab" onclick="showSection('rsvp')">5. RSVP</button>
          <button class="sec-tab" onclick="showSection('custom')">
            6. Custom
          </button>
          <button class="sec-tab" onclick="showSection('style')">Style</button>
        </div>

        <div class="fields-scroll">
          <!-- HERO -->
          <div class="panel-section active" id="sec-hero">
            <div class="field-group">
              <label class="field-label">Background Image URL</label>
              <input
                class="field-input"
                id="heroImage"
                value="00_IMAGE/WhatsApp Image 2026-03-20 at 15.31.05.jpeg"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Name 1</label>
              <input
                class="field-input"
                id="name1"
                value="Sonya"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Name 2</label>
              <input
                class="field-input"
                id="name2"
                value="Marton"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Eyebrow Text</label>
              <input
                class="field-input"
                id="eyebrow"
                value="WE ARE GETTING MARRIED"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Location Line</label>
              <input
                class="field-input"
                id="heroLocation"
                value="Mad · Tokaj Wine Region, Hungary"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Hero RSVP Button Text</label>
              <input
                class="field-input"
                id="btnNavRSVP"
                value="Kindly RSVP"
                oninput="update()"
              />
            </div>
          </div>

          <!-- DETAILS -->
          <div class="panel-section" id="sec-details">
            <div class="field-group">
              <label class="field-label">Main Date (Full Display)</label>
              <input
                class="field-input"
                id="dateDisplay"
                value="Saturday, 10th of October, 2026"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Short Date (Footer)</label>
              <input
                class="field-input"
                id="dateShort"
                value="10 Oct 2026"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Venue Name</label>
              <input
                class="field-input"
                id="venueName"
                value="Mad, Hungary"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Venue Address</label>
              <textarea
                class="field-input textarea"
                id="venueAddress"
                oninput="update()"
              >
Tokaj Wine Region
Hungary</textarea
              >
            </div>
            <div class="field-group">
              <label class="field-label">Dress Code Title</label>
              <input
                class="field-input"
                id="dressTitle"
                value="Cocktail Attire"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Dress Code Note</label>
              <input
                class="field-input"
                id="dressNote"
                value="Semi-formal. Comfort is key for village walks!"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Directions</label>
              <textarea
                class="field-input textarea"
                id="gettingThere"
                oninput="update()"
              >
Flights to Budapest, then a 2.5hr drive or train to Mad.</textarea
              >
            </div>
          </div>

          <!-- SCHEDULE -->
          <div class="panel-section" id="sec-schedule">
            <div id="schedule-repeater"></div>
            <button class="btn-add" onclick="addScheduleItem()">
              + Add Event
            </button>
          </div>

          <!-- STAY -->
          <div class="panel-section" id="sec-stay">
            <div class="field-group">
              <label class="field-label">Accommodation Intro</label>
              <textarea
                class="field-input textarea"
                id="stayIntro"
                oninput="update()"
              >
We recommend staying in local guesthouses in Mad to enjoy the village atmosphere.</textarea
              >
            </div>
            <div class="field-group">
              <label class="field-label">Booking Code</label>
              <input
                class="field-input"
                id="bookingCode"
                value="Sonya & Marton Wedding"
                oninput="update()"
              />
            </div>
            <div id="stay-repeater"></div>
            <button class="btn-add" onclick="addStayItem()">
              + Add Option
            </button>
          </div>

          <!-- RSVP -->
          <div class="panel-section" id="sec-rsvp">
            <div
              class="field-group"
              style="background: #222; padding: 1rem; border: 1px solid #444"
            >
              <label class="field-label" style="color: var(--gold)"
                >Form Backend URL</label
              >
              <input
                class="field-input"
                id="formUrl"
                placeholder="https://formspree.io/f/your-id"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">RSVP Intro Text</label>
              <textarea
                class="field-input textarea"
                id="rsvpIntro"
                oninput="update()"
              >
Please let us know if you can join us in Hungary, Sydney, or both!</textarea
              >
            </div>
            <div class="field-group">
              <label class="field-label">Accept Button Label</label>
              <input
                class="field-input"
                id="btnYes"
                value="Joyfully accepts"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Decline Button Label</label>
              <input
                class="field-input"
                id="btnNo"
                value="Regretfully declines"
                oninput="update()"
              />
            </div>
            <div class="field-group">
              <label class="field-label">Success Message</label>
              <textarea
                class="field-input textarea"
                id="tyMsg"
                oninput="update()"
              >
We can't wait to celebrate with you!</textarea
              >
            </div>
          </div>

          <!-- CUSTOM SECTIONS -->
          <div class="panel-section" id="sec-custom">
            <div
              class="field-group"
              style="
                background: #1a1a1a;
                padding: 1rem;
                border: 1px solid var(--gold);
              "
            >
              <p
                style="
                  font-size: 0.75rem;
                  color: var(--gold);
                  margin-bottom: 0.5rem;
                "
              >
                Custom sections appear on the website for ALL languages. Edit
                text separately for each language.
              </p>
            </div>
            <div id="custom-sections-repeater"></div>
            <button class="btn-add" onclick="addCustomSection()">
              + Add Custom Section
            </button>
          </div>

          <!-- STYLE -->
          <div class="panel-section" id="sec-style">
            <div class="field-group">
              <label class="field-label">Accent Color</label>
              <div class="color-row">
                <input
                  type="color"
                  class="color-swatch"
                  id="clr-gold"
                  value="#B8934A"
                  oninput="syncColor('clr-gold', 'clr-gold-hex')"
                />
                <input
                  class="field-input color-hex"
                  id="clr-gold-hex"
                  value="#B8934A"
                  oninput="syncHex('clr-gold-hex', 'clr-gold')"
                />
              </div>
            </div>
            <div class="field-group">
              <label class="field-label">Background Color</label>
              <div class="color-row">
                <input
                  type="color"
                  class="color-swatch"
                  id="clr-bg"
                  value="#FAF8F4"
                  oninput="syncColor('clr-bg', 'clr-bg-hex')"
                />
                <input
                  class="field-input color-hex"
                  id="clr-bg-hex"
                  value="#FAF8F4"
                  oninput="syncHex('clr-bg-hex', 'clr-bg')"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="preview-wrap">
        <div class="preview-bar">
          <div class="preview-url">live-preview/index.html</div>
          <div style="display: flex; gap: 0.5rem">
            <button
              onclick="
                document.getElementById('preview').classList.remove('mobile')
              "
            >
              Desktop
            </button>
            <button
              onclick="
                document.getElementById('preview').classList.add('mobile')
              "
            >
              Mobile
            </button>
          </div>
        </div>
        <div class="preview-frame-wrap">
          <iframe id="preview"></iframe>
        </div>
      </div>
    </div>

    <div class="save-toast" id="save-toast">Draft Saved ✓</div>

    <script>
      let currentLang = "en";
      let globalStyle = { gold: "#B8934A", bg: "#FAF8F4" };
      let formUrl = "https://formspree.io/f/xlgorpaw";

      let content = {};

      function showSection(id) {
        document
          .querySelectorAll(".panel-section")
          .forEach((s) => s.classList.remove("active"));
        document
          .querySelectorAll(".sec-tab")
          .forEach((t) => t.classList.remove("active"));
        document.getElementById("sec-" + id).classList.add("active");
        event.target.classList.add("active");
      }

      function setLanguage(lang) {
        saveCurrentToContent();
        currentLang = lang;
        document
          .querySelectorAll(".lang-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.lang === lang),
          );
        loadContent();
      }

      function saveCurrentToContent() {
        const d = content[currentLang];
        if (!d) return;
        [
          "name1",
          "name2",
          "eyebrow",
          "heroLocation",
          "dateDisplay",
          "dateShort",
          "venueName",
          "venueAddress",
          "dressTitle",
          "dressNote",
          "gettingThere",
          "stayIntro",
          "bookingCode",
          "rsvpIntro",
          "btnYes",
          "btnNo",
          "tyMsg",
          "heroImage",
          "btnNavRSVP",
        ].forEach((id) => {
          const el = document.getElementById(id);
          if (el) d[id] = el.value;
        });
        formUrl = document.getElementById("formUrl").value;
      }

      function loadContent() {
        const d = content[currentLang];
        [
          "name1",
          "name2",
          "eyebrow",
          "heroLocation",
          "dateDisplay",
          "dateShort",
          "venueName",
          "venueAddress",
          "dressTitle",
          "dressNote",
          "gettingThere",
          "stayIntro",
          "bookingCode",
          "rsvpIntro",
          "btnYes",
          "btnNo",
          "tyMsg",
          "heroImage",
          "btnNavRSVP",
        ].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.value = d[id];
        });
        document.getElementById("formUrl").value = formUrl;
        renderSchedule();
        renderStay();
        renderCustomSections();
        update();
      }

      function renderSchedule() {
        const cont = document.getElementById("schedule-repeater");
        cont.innerHTML = "";
        content[currentLang].schedule.forEach((item, i) => {
          const div = document.createElement("div");
          div.className = "repeater-item";
          div.innerHTML = `<div class="repeater-item-header"><span class="repeater-item-title">Event ${i + 1}</span><button class="btn-del" onclick="deleteItem('schedule',${i})">✕</button></div>
      <input class="field-input" value="${item.time}" oninput="content['${currentLang}'].schedule[${i}].time=this.value;update()" placeholder="Time">
      <input class="field-input" value="${item.title}" oninput="content['${currentLang}'].schedule[${i}].title=this.value;update()" placeholder="Title" style="margin-top:0.5rem">
      <textarea class="field-input textarea" oninput="content['${currentLang}'].schedule[${i}].desc=this.value;update()" placeholder="Description" style="margin-top:0.5rem">${item.desc}</textarea>`;
          cont.appendChild(div);
        });
      }
      function addScheduleItem() {
        content[currentLang].schedule.push({ time: "", title: "", desc: "" });
        renderSchedule();
        update();
      }

      function renderStay() {
        const cont = document.getElementById("stay-repeater");
        cont.innerHTML = "";
        content[currentLang].stay.forEach((item, i) => {
          const div = document.createElement("div");
          div.className = "repeater-item";
          div.innerHTML = `<div class="repeater-item-header"><span class="repeater-item-title">Option ${i + 1}</span><button class="btn-del" onclick="deleteItem('stay',${i})">✕</button></div>
      <input class="field-input" value="${item.name}" oninput="content['${currentLang}'].stay[${i}].name=this.value;update()" placeholder="Name">
      <input class="field-input" value="${item.tag}" oninput="content['${currentLang}'].stay[${i}].tag=this.value;update()" placeholder="Tag" style="margin-top:0.5rem">
      <textarea class="field-input textarea" oninput="content['${currentLang}'].stay[${i}].desc=this.value;update()" placeholder="Description" style="margin-top:0.5rem">${item.desc}</textarea>`;
          cont.appendChild(div);
        });
      }
      function addStayItem() {
        content[currentLang].stay.push({ name: "", tag: "", desc: "" });
        renderStay();
        update();
      }

      function deleteItem(type, i) {
        content[currentLang][type].splice(i, 1);
        if (type === "schedule") renderSchedule();
        else renderStay();
        update();
      }

      function renderCustomSections() {
        const cont = document.getElementById("custom-sections-repeater");
        cont.innerHTML = "";
        content[currentLang].customSections.forEach((item, i) => {
          const div = document.createElement("div");
          div.className = "repeater-item";
          div.innerHTML = `<div class="repeater-item-header"><span class="repeater-item-title">Custom Section ${i + 1}</span><button class="btn-del" onclick="deleteCustomSection(${i})">✕</button></div>
      <input class="field-input" value="${item.title || ""}" oninput="updateCustomSection(${i}, 'title', this.value)" placeholder="Section Title">
      <textarea class="field-input textarea" oninput="updateCustomSection(${i}, 'content', this.value)" placeholder="Section Content (HTML supported)" style="margin-top:0.5rem; min-height: 120px;">${item.content || ""}</textarea>`;
          cont.appendChild(div);
        });
      }

      function addCustomSection() {
        // Add to ALL languages simultaneously
        const langs = ["en", "hu", "ru"];
        langs.forEach((lang) => {
          if (!content[lang].customSections) {
            content[lang].customSections = [];
          }
          content[lang].customSections.push({ title: "", content: "" });
        });
        renderCustomSections();
        update();
      }

      function updateCustomSection(index, field, value) {
        // Update for ALL languages to keep structure in sync
        const langs = ["en", "hu", "ru"];
        langs.forEach((lang) => {
          if (
            content[lang].customSections &&
            content[lang].customSections[index]
          ) {
            content[lang].customSections[index][field] = value;
          }
        });
        update();
      }

      function deleteCustomSection(index) {
        // Delete from ALL languages
        const langs = ["en", "hu", "ru"];
        langs.forEach((lang) => {
          if (content[lang].customSections) {
            content[lang].customSections.splice(index, 1);
          }
        });
        renderCustomSections();
        update();
      }

      function syncColor(s, h) {
        document.getElementById(h).value = document.getElementById(s).value;
        updateStyle();
      }
      function syncHex(h, s) {
        const v = document.getElementById(h).value;
        if (/^#[0-9A-F]{6}$/i.test(v)) {
          document.getElementById(s).value = v;
          updateStyle();
        }
      }
      function updateStyle() {
        globalStyle.gold = document.getElementById("clr-gold-hex").value;
        globalStyle.bg = document.getElementById("clr-bg-hex").value;
        update();
      }

      function getData() {
        saveCurrentToContent();
        return { content, style: globalStyle, formUrl };
      }

      function buildHTML(data) {
        const c = data.content;
        const s = data.style;
        const langScript = `
    let currentLang = 'en'; const content = ${JSON.stringify(c)};
    function setLanguage(lang) {
      currentLang = lang; const d = content[lang];
      document.querySelectorAll('[data-t]').forEach(el => {
        const key = el.dataset.t; if(!d[key]) return;
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') el.value = d[key];
        else if(key==='venueAddress') el.innerHTML = d[key].replace(/\\n/g, '<br>');
        else el.textContent = d[key];
      });
      document.querySelector('.hero-names').innerHTML = \`\${d.name1}<span class="hero-ampersand">&amp;</span>\${d.name2}\`;
      document.querySelector('.timeline').innerHTML = d.schedule.map(item => \`<div class="timeline-item"><div class="timeline-time">\${item.time}</div><div class="timeline-desc"><h4>\${item.title}</h4><p>\${item.desc}</p></div></div>\`).join('');
      document.querySelector('.stay-cards').innerHTML = d.stay.map(item => \`<div class="stay-card"><div class="stay-tag">\${item.tag}</div><h3>\${item.name}</h3><p>\${item.desc}</p></div>\`).join('');
      // Render custom sections
      const customContainer = document.getElementById('custom-sections-container');
      if (customContainer && d.customSections) {
        customContainer.innerHTML = d.customSections.map((section, i) => \`<section id="custom-\${i}" class="custom-section"><div class="section-inner"><h2 class="section-title">\${section.title}</h2><div class="custom-content">\${section.content}</div></div></section>\`).join('');
      }
      document.getElementById('btn-yes').textContent = d.btnYes;
      document.getElementById('btn-no').textContent = d.btnNo;
      document.querySelectorAll('.lang-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.title = \`\${d.name1} & \${d.name2}\`;
    }
    window.onload = () => setLanguage('en');
  `;

        return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:${s.bg};--charcoal:#2C2C2C;--gold:${s.gold};--white:#FFF;--font-display:'Cormorant Garamond',serif;--font-body:'Tenor Sans',sans-serif;}
html { scroll-behavior: smooth; } body { font-family: var(--font-body); background: var(--bg); color: var(--charcoal); overflow-x: hidden; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: center; align-items: center; gap: 2rem; padding: 1.2rem; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; }
nav a { color: var(--charcoal); text-decoration: none; transition: 0.2s; } .lang-nav { display: flex; gap: 0.8rem; margin-left: 1.5rem; padding-left: 1.5rem; border-left: 1px solid #ddd; }
.lang-nav-btn { background: none; border: none; cursor: pointer; font-size: 0.65rem; color: #888; transition: 0.2s; } .lang-nav-btn.active { color: var(--gold); font-weight: 600; }
section { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 6rem 2rem; position: relative; } .section-inner { max-width: 940px; margin: 0 auto; width: 100%; }
#hero { background-image: url('${c.en.heroImage}'); background-size: cover; background-position: center; color: white; text-align: center; }
#hero::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.35); z-index: 1; } .hero-content { position: relative; z-index: 2; }
.hero-eyebrow { font-size: 0.8rem; letter-spacing: 0.4em; margin-bottom: 1.5rem; font-weight: 600; }
.hero-names { font-family: var(--font-display); font-size: clamp(3.5rem, 12vw, 8rem); line-height: 0.9; text-transform: uppercase; margin-bottom: 1.5rem; font-weight: 600; }
.hero-ampersand { display: block; font-size: 0.4em; margin: 0.5rem 0; font-weight: 300; font-style: italic; }
.hero-location { font-size: 0.8rem; letter-spacing: 0.2em; opacity: 0.9; text-transform: uppercase; margin-bottom: 3rem; }
.hero-cta { display: inline-block; padding: 1.1rem 3.2rem; border: 1.5px solid white; color: white; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; transition: 0.25s; font-weight: 600; }
.hero-cta:hover { background: white; color: black; }
.section-label { font-size: 0.7rem; letter-spacing: 0.35em; color: var(--gold); margin-bottom: 1rem; text-transform: uppercase; font-weight: 600; }
.section-title { font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 3.5rem; font-weight: 300; line-height: 1.2; }
.details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 3rem; }
.detail-card h3 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 0.8rem; font-weight: 600; border-bottom: 1px solid var(--gold); padding-bottom: 0.5rem; display: inline-block; }
.timeline { position: relative; padding-left: 2.5rem; border-left: 1px solid #ddd; margin-left: 0.5rem; } .timeline-item { margin-bottom: 3rem; position: relative; }
.timeline-item::before { content: ''; position: absolute; left: -2.85rem; top: 0.5rem; width: 11px; height: 11px; background: var(--gold); border-radius: 50%; }
.stay-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2.5rem; }
.stay-card { padding: 2.5rem; border: 1px solid #ddd; background: white; } .stay-tag { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; margin-bottom: 1rem; font-weight: 600; }
#rsvp { background: var(--charcoal); color: white; } #rsvp .section-title { color: white; }
.rsvp-form { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 800px; margin: 0 auto; }
.form-group { display: flex; flex-direction: column; gap: 0.6rem; } .form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.8; font-weight: 600; }
.form-group input, .form-group select { background: transparent; border: none; border-bottom: 1px solid #555; padding: 0.8rem 0; color: white; outline: none; font-family: var(--font-body); font-size: 1rem; }
.event-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem; } .event-opt { border: 1px solid #444; padding: 1.2rem; cursor: pointer; }
.event-opt.active { background: var(--gold); border-color: var(--gold); } .event-opt input { display: none; }
.attend-toggle { display: flex; gap: 1rem; } .attend-btn { flex: 1; padding: 1.1rem; border: 1px solid #555; background: transparent; color: white; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
.attend-btn.active-yes { background: var(--gold); border-color: var(--gold); }
#plus-one-section { grid-column: 1 / -1; overflow: hidden; max-height: 0; transition: 0.4s; opacity: 0; } #plus-one-section.visible { max-height: 150px; opacity: 1; margin-top: 1rem; }
.rsvp-submit { grid-column: 1 / -1; background: var(--gold); color: white; border: none; padding: 1.3rem; cursor: pointer; text-transform: uppercase; font-weight: 600; margin-top: 1rem; font-size: 0.8rem; }
.rsvp-thankyou { display: none; text-align: center; padding: 4rem 0; } .rsvp-thankyou.visible { display: block; }
footer { padding: 5rem; text-align: center; font-size: 0.7rem; opacity: 0.5; text-transform: uppercase; background: #1a1a1a; color: white; }
@media(max-width:768px) { nav { flex-wrap: wrap; } .rsvp-form { grid-template-columns: 1fr; } .event-choices { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav><div class="links"><a href="#details">Details</a><a href="#schedule">Schedule</a><a href="#stay">Stay</a><a href="#rsvp">RSVP</a></div><div class="lang-nav"><button class="lang-nav-btn active" data-lang="en" onclick="setLanguage('en')">EN</button><button class="lang-nav-btn" data-lang="hu" onclick="setLanguage('hu')">HU</button><button class="lang-nav-btn" data-lang="ru" onclick="setLanguage('ru')">RU</button></div></nav>
<section id="hero"><div class="hero-content"><p class="hero-eyebrow" data-t="eyebrow"></p><h1 class="hero-names"></h1><p class="hero-location" data-t="heroLocation"></p><a href="#rsvp" class="hero-cta" data-t="btnNavRSVP"></a></div></section>
<section id="details"><div class="section-inner"><p class="section-label">Information</p><h2 class="section-title" data-t="dateDisplay"></h2><div class="details-grid"><div class="detail-card"><h3>Venue</h3><p data-t="venueName"></p><p data-t="venueAddress"></p></div><div class="detail-card"><h3>Dress Code</h3><p data-t="dressTitle"></p><p data-t="dressNote"></p></div><div class="detail-card"><h3>Directions</h3><p data-t="gettingThere"></p></div></div></div></section>
<section id="schedule"><div class="section-inner"><p class="section-label">Events</p><h2 class="section-title">Schedule</h2><div class="timeline"></div></div></section>
<section id="stay"><div class="section-inner"><p class="section-label">Accommodation</p><h2 class="section-title">Where to Stay</h2><p style="margin-bottom:3.5rem; font-size: 1.1rem;" data-t="stayIntro"></p><div class="stay-cards"></div><p style="margin-top:3.5rem;">Booking Code: <b data-t="bookingCode" style="color:var(--gold)"></b></p></div></section>
<div id="custom-sections-container"></div>
<section id="rsvp"><div class="section-inner"><p class="section-label" style="color:white">Join Us</p><h2 class="section-title">RSVP</h2><p style="margin-bottom:3.5rem;" data-t="rsvpIntro"></p>
<div id="rsvp-form-wrap"><form class="rsvp-form" action="${data.formUrl}" method="POST" onsubmit="handleRSVP(event)">
<div class="form-group"><label>Full Name</label><input type="text" name="name" id="f-name" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email" required></div>
<div class="form-group full"><label>Events</label><div class="event-choices">
  <div class="event-opt" onclick="toggleEvent(this)"><input type="checkbox" name="events" value="Hungary"><h4>Hungary</h4><p>10 Oct 2026</p></div>
  <div class="event-opt" onclick="toggleEvent(this)"><input type="checkbox" name="events" value="Sydney"><h4>Sydney</h4><p>20 Nov 2026</p></div>
</div></div>
<div class="form-group"><label>Guests</label><select name="guests" style="background:#333; color:white;"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div class="form-group"><label>Attending?</label><div class="attend-toggle"><button type="button" class="attend-btn" id="btn-yes" onclick="setAttending('yes')"></button><button type="button" class="attend-btn" id="btn-no" onclick="setAttending('no')"></button></div><input type="hidden" name="attending" id="f-attending" required></div>
<div class="form-group full" id="plus-one-section"><label>Guest Name</label><input type="text" name="guest_name"></div>
<input type="hidden" name="_subject" id="f-subject" value="Wedding RSVP">
<button type="submit" class="rsvp-submit">Send RSVP</button></form></div>
<div class="rsvp-thankyou" id="rsvp-thankyou"><h3>Thank You!</h3><p id="ty-body"></p></div></div></section>
<footer><p><span data-t="name1"></span> &amp; <span data-t="name2"></span> — <span data-t="dateShort"></span></p></footer>
<script>${langScript}
function toggleEvent(el){ el.classList.toggle('active'); const cb=el.querySelector('input'); cb.checked=!cb.checked; }
function setAttending(v){ document.getElementById('f-attending').value=v; document.getElementById('btn-yes').className='attend-btn'+(v==='yes'?' active-yes':''); document.getElementById('btn-no').className='attend-btn'+(v==='no'?' active-no':''); document.getElementById('plus-one-section').classList.toggle('visible',v==='yes'); }
function handleRSVP(e){ 
  const name = document.getElementById('f-name').value; const att = document.getElementById('f-attending').value.toUpperCase();
  document.getElementById('f-subject').value = \`[WEDDING] [\${name}] [\${att}]\`;
  if (e.target.action === window.location.href || e.target.action === '#') { e.preventDefault(); document.getElementById('rsvp-form-wrap').style.display='none'; document.getElementById('rsvp-thankyou').classList.add('visible'); document.getElementById('ty-body').textContent=content[currentLang].tyMsg; }
}
<\/script></body></html>`;
      }

      function update() {
        clearTimeout(window.dt);
        window.dt = setTimeout(() => {
          const html = buildHTML(getData());
          const iframe = document.getElementById("preview");
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.open();
          doc.write(html);
          doc.close();
        }, 150);
      }
      function exportSite() {
        const html = buildHTML(getData());
        const blob = new Blob([html], { type: "text/html" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "index.html";
        a.click();
      }
      function saveLocal() {
        try {
          saveCurrentToContent();
          localStorage.setItem(
            "wedding-editor-v3",
            JSON.stringify({ content, style: globalStyle, formUrl }),
          );
          document.getElementById("save-toast").classList.add("show");
          setTimeout(
            () =>
              document.getElementById("save-toast").classList.remove("show"),
            2000,
          );
        } catch (e) {}
      }

      window.onload = () => {
        fetch("./content.json")
          .then((r) => r.json())
          .then((fetched) => {
            const saved = localStorage.getItem("wedding-editor-v3");
            if (saved) {
              const d = JSON.parse(saved);
              content = d.content;
              globalStyle = d.style;
              formUrl = d.formUrl || "";
            } else {
              content = fetched;
            }
            loadContent();
          });
      };
    </script>
  </body>
</html>
